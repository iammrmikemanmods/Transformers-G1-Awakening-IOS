name: ClassicBubbles Lab 0.1.3 Low Power Mode recovery experiment
on:
  push:
    branches: [ci/classicbubbles-lab-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source with verified 0.1.1, 0.1.2 and 0.1.3 patches
        shell: bash
        run: |
          set -euo pipefail
          cat ci/classicbubbles/source.part*.b64 | base64 -D > /tmp/classicbubbles-source.tar.xz
          echo 'b11ac84dc5c63860b3bf189e3fec95efcc9c7133b2187513d4194f877dde81b8  /tmp/classicbubbles-source.tar.xz' | shasum -a 256 -c -
          cat ci/classicbubbles/v011.patch.part1 ci/classicbubbles/v011.patch.part2 ci/classicbubbles/v011.patch.part3 > /tmp/v011.patch.xz
          echo '29d598152f5f83c2d7bb59bb4721a7db322b2ceb3e477a4eccdaf8329f415dda  /tmp/v011.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v011.patch.xz > /tmp/v011.patch
          echo 'd819371b72a72431c3a5c432dcf91b84acde1f2c5755164894d5494397537ec4  /tmp/v011.patch' | shasum -a 256 -c -
          mkdir work
          tar -xJf /tmp/classicbubbles-source.tar.xz -C work
          cd work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          for path, expected in json.loads(Path('SHA256_MANIFEST.json').read_text()).items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          PY
          patch -p1 -F 0 --batch --forward -i /tmp/v011.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          paths = [p for p in sorted(Path('.').rglob('*')) if p.is_file() and p.name != 'SHA256_MANIFEST.json']
          assert len(paths) == 31, [str(p) for p in paths]
          manifest = {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          text = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          assert hashlib.sha256(text.encode()).hexdigest() == '330828ec3ebd9ee4569eaaeaa23c652145d452f501bab418aa9f97980297323c', text
          Path('SHA256_MANIFEST.json').write_text(text)
          print('PASS: all 31 source file hashes match the audited 0.1.1 source')
          PY
          cat ../ci/classicbubbles/v012.patch.part1 ../ci/classicbubbles/v012.patch.part2 ../ci/classicbubbles/v012.patch.part3 ../ci/classicbubbles/v012.patch.part4 | base64 -D > /tmp/v012.patch.xz
          echo '70cc3d72d2e579b09b3ff0a5df1806aaecedee5dc38ed6a18b08a2c4c1ee1fcc  /tmp/v012.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v012.patch.xz > /tmp/v012.patch
          echo 'a56daeae074ca113f326e7afbc3c63574f0028d845c702938dad50fc203be4ac  /tmp/v012.patch' | shasum -a 256 -c -
          patch -p1 -F 0 --batch --forward -i /tmp/v012.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('lab/CBLPreview.m')
          raw = p.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '14a767b7ef35cf0ac0d3562c44cdf4946984123b2cef7852753fef7349b4e785'
          old = '    self.fullscreenToggle.configuration = [UIButtonConfiguration filledButtonConfiguration];'
          new = '    UIButtonConfiguration *toggleStyle = [UIButtonConfiguration filledButtonConfiguration];\n    toggleStyle.title = @"Hide controls";\n    self.fullscreenToggle.configuration = toggleStyle;'
          text = raw.decode()
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'abc8287d43c4b328b9bf22dc9ef7e95be660ba2a442e9ea36ff73784a452b910'

          p = Path('.github/workflows/build.yml')
          raw = p.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'aa51500ea8abab7f7da2abd7bf6f44b5b505e41036cc517bc87bcb2ba2105b75'
          text = raw.decode()
          for old, new in [
              ('theos-branch: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c','theos-branch: master'),
              ('sdks-branch: 0222fd5413cf4b9af096f37b4621afa2688572f7','sdks-branch: master')
          ]:
              assert text.count(old) == 1
              text = text.replace(old, new)
          anchor = '      - name: Ensure package validation tools\n'
          verified = """      - name: Verify exact Theos and SDK revisions before compilation\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$(git -C "$THEOS" rev-parse HEAD)" = '8167f59de02fd32cf45b16bfcb1330dfa5c9974c'\n          test "$(git -C "$THEOS/sdks" rev-parse HEAD)" = '0222fd5413cf4b9af096f37b4621afa2688572f7'\n"""
          assert text.count(anchor) == 1
          p.write_text(text.replace(anchor, verified + anchor))
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual == '487fe6a51c688fe7fbb91dbb49e95472f3139d518d9a5843e006617c2bb28b9a', actual
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          paths = [p for p in sorted(Path('.').rglob('*')) if p.is_file() and p.name != 'SHA256_MANIFEST.json']
          assert len(paths) == 31, [str(p) for p in paths]
          manifest = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          txt = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          actual = hashlib.sha256(txt.encode()).hexdigest()
          assert actual == '21d5b8b3a0799ffaad9f7d20c935d9c635ab09cdab281c9f3bde9835b4f49f48', actual
          Path('SHA256_MANIFEST.json').write_text(txt)
          print('PASS: all 31 source hashes match audited 0.1.2')
          PY
          cat ../ci/classicbubbles/v013.patch.part1.b64 ../ci/classicbubbles/v013.patch.part2.b64 ../ci/classicbubbles/v013.patch.part3.b64 ../ci/classicbubbles/v013.patch.part4.b64 | base64 -D > /tmp/v013.patch.xz
          echo 'a4ee55b44f7432ab03b87a0c73e2ccc72df30624e90e6e0cb37f0d1ba2330ef1  /tmp/v013.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v013.patch.xz > /tmp/v013.patch
          echo '867c49f002277f6deb71448a16df19b5714d29e0dc756a824a2e8379f3bac2e7  /tmp/v013.patch' | shasum -a 256 -c -
          patch -p1 -F 0 --batch --forward -i /tmp/v013.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest_bytes = Path('SHA256_MANIFEST.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == 'ab58b21b605d233ca9559da06145c50f9e9a9ce9a65977d6c3616ebfd1e81092'
          manifest = json.loads(manifest_bytes)
          files = [p for p in Path('.').rglob('*') if p.is_file() and p.name != 'SHA256_MANIFEST.json']
          assert len(files) == len(manifest) == 34
          assert {str(p) for p in files} == set(manifest)
          for path, expected in manifest.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          print('PASS: 0.1.3 has exactly 34 integrity-verified source files')
          PY
          python3 tests/test_source.py
          clang -O2 -Wall -Wextra -Werror common/CBLRunner.c tests/runner_test.c -o /tmp/cbl-runner-test
          /tmp/cbl-runner-test | tee RUNNER_TESTS.txt
          clang -O2 -Wall -Wextra -Werror common/CBLColor.c tests/color_test.c -o /tmp/cbl-color-test
          /tmp/cbl-color-test | tee COLOR_TESTS.txt
          clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic common/CBLPowerRecovery.c tests/power_recovery_test.c -o /tmp/cbl-power-test
          /tmp/cbl-power-test | tee POWER_RECOVERY_TESTS.txt
          clang -fobjc-arc -fblocks -O2 -Wall -Wextra -Werror -framework Foundation -framework CoreFoundation common/CBLPresets.m common/CBLColor.c tests/preset_test.m -o /tmp/cbl-preset-test
          /tmp/cbl-preset-test | tee PRESET_TESTS.txt
      - name: Install pinned Theos and SDK
        uses: waruhachi/theos-action@97afc8c6c361c8b379ee64f42c8a0e41d725ce37
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: 'false'
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'
      - name: Confirm exact toolchain snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = '8167f59de02fd32cf45b16bfcb1330dfa5c9974c'
          test "$(git -C "$THEOS/sdks" rev-parse HEAD)" = '0222fd5413cf4b9af096f37b4621afa2688572f7'
      - name: Ensure packaging tools
        shell: bash
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
      - name: Compile actual ARM64 app and helper, package and verify
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee BUILD_LOG.txt
          for deb in packages/*.deb; do
            stage=$(mktemp -d)
            dpkg-deb --raw-extract "$deb" "$stage"
            dpkg-deb --root-owner-group -Zxz -z9 --build "$stage" "$deb.normalized"
            mv "$deb.normalized" "$deb"
            rm -rf -- "$stage"
          done
          python3 tests/validate_deb.py packages/*.deb | tee PACKAGE_VALIDATION.txt
          shasum -a 256 packages/*.deb | tee BUILD_SHA256.txt
          { xcodebuild -version; xcrun clang --version; git -C "$THEOS" rev-parse HEAD; } > BUILD_TOOLCHAIN.txt
      - name: Upload compiled package and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicBubbles-Lab-0.1.3-rootless
          path: |
            work/packages/*.deb
            work/BUILD_LOG.txt
            work/PACKAGE_VALIDATION.txt
            work/BUILD_SHA256.txt
            work/BUILD_TOOLCHAIN.txt
            work/RUNNER_TESTS.txt
            work/COLOR_TESTS.txt
            work/POWER_RECOVERY_TESTS.txt
            work/PRESET_TESTS.txt
            work/SHA256_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
