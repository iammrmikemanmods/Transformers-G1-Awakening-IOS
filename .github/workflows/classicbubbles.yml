name: ClassicBubbles Lab 0.1.0 native diagnostic app
on:
  push:
    branches: [ci/classicbubbles-lab-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/classicbubbles/source.part*.b64 | base64 -D > /tmp/classicbubbles-source.tar.xz
          echo 'b11ac84dc5c63860b3bf189e3fec95efcc9c7133b2187513d4194f877dde81b8  /tmp/classicbubbles-source.tar.xz' | shasum -a 256 -c -
          mkdir work
          tar -xJf /tmp/classicbubbles-source.tar.xz -C work
          cd work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest = json.loads(Path('SHA256_MANIFEST.json').read_text())
          for path, expected in manifest.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          p = Path('lab/ClassicBubblesLab.m')
          s = p.read_text()
          replacements = {
              'button.contentEdgeInsets = UIEdgeInsetsMake(12, 14, 12, 14);': '''UIButtonConfiguration *configuration = [UIButtonConfiguration plainButtonConfiguration];
              configuration.attributedTitle = [[NSAttributedString alloc] initWithString:title attributes:@{NSFontAttributeName: [UIFont systemFontOfSize:16 weight:UIFontWeightSemibold]}];
              configuration.contentInsets = NSDirectionalEdgeInsetsMake(12, 14, 12, 14);
              button.configuration = configuration;''',
              'self.shareButton.contentEdgeInsets = UIEdgeInsetsMake(14, 14, 14, 14);': '''UIButtonConfiguration *shareConfiguration = [UIButtonConfiguration plainButtonConfiguration];
              shareConfiguration.attributedTitle = [[NSAttributedString alloc] initWithString:@"Share Report…" attributes:@{NSFontAttributeName: [UIFont systemFontOfSize:17 weight:UIFontWeightSemibold]}];
              shareConfiguration.contentInsets = NSDirectionalEdgeInsetsMake(14, 14, 14, 14);
              self.shareButton.configuration = shareConfiguration;''',
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          assert 'contentEdgeInsets' not in s
          p.write_text(s)
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == 'e85a783f858a352e54cf0b8aa4eb70e9f0e22a3080226cb904fdeb13522a19d6', digest
          manifest[str(p)] = digest
          for sub, expected in [('lab', '00c6fb182b0661913e13b2a134d14040882ab13c1ea7316b69da0b00e30cbcee'), ('probe', 'e527cea49d5818cf77ee6e78e4d23074450434ae8efcf0f58b97a6652a676e56')]:
              p = Path(sub) / 'Makefile'
              s = p.read_text()
              old = '$(THEOS_PROJECT_DIR)/entitlements.plist'
              assert s.count(old) == 1
              p.write_text(s.replace(old, f'$(THEOS_PROJECT_DIR)/{sub}/entitlements.plist'))
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              assert digest == expected, digest
              manifest[str(p)] = digest
          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          anchor = '          make clean package FINALPACKAGE=1 2>&1 | tee BUILD_LOG.txt\n'
          normal = '          for deb in packages/*.deb; do\n            stage=$(mktemp -d)\n            dpkg-deb --raw-extract "$deb" "$stage"\n            dpkg-deb --root-owner-group -Zxz -z9 --build "$stage" "$deb.normalized"\n            mv "$deb.normalized" "$deb"\n            rm -rf -- "$stage"\n          done\n'
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, anchor + normal))
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == 'ae0226286563b8bd032a071cff2ff3ceee9aed35d284632f0627ef0cbcb57924'
          manifest[str(p)] = digest
          p = Path('README.md')
          s = p.read_text()
          anchor = 'Use current Xcode and Theos, then `make clean package FINALPACKAGE=1`.\n'
          new = 'Use the included macOS GitHub Actions workflow for the verified release path.\nIt compiles using Xcode/Theos, then normalises numeric archive ownership to 0:0\nwith `dpkg-deb --root-owner-group` before validation. Direct Theos packaging on\nmacOS can retain the build account\'s numeric UID/GID despite root/wheel names;\ndo not distribute that unnormalised intermediate package.\n'
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, new))
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == 'bca9454ec288ac3bfddd6d6ea28e614d2a57a29a4ddc3eda4c7a7e3acc5a0d78'
          manifest[str(p)] = digest
          Path('SHA256_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          python3 tests/test_source.py
          clang -O2 -Wall -Wextra -Werror common/CBLRunner.c tests/runner_test.c -o /tmp/cbl-runner-test
          /tmp/cbl-runner-test | tee RUNNER_TESTS.txt
      - name: Install Theos and iOS SDK
        uses: waruhachi/theos-action@97afc8c6c361c8b379ee64f42c8a0e41d725ce37
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: 'false'
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'
      - name: Ensure packaging tools
        shell: bash
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
      - name: Compile actual ARM64 app and helper, package and verify
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee BUILD_LOG.txt
          for deb in packages/*.deb; do
            stage=$(mktemp -d)
            dpkg-deb --raw-extract "$deb" "$stage"
            dpkg-deb --root-owner-group -Zxz -z9 --build "$stage" "$deb.normalized"
            mv "$deb.normalized" "$deb"
            rm -rf -- "$stage"
          done
          python3 tests/validate_deb.py packages/*.deb | tee PACKAGE_VALIDATION.txt
          shasum -a 256 packages/*.deb | tee BUILD_SHA256.txt
          { xcodebuild -version; xcrun clang --version; git -C "$THEOS" rev-parse HEAD; } > BUILD_TOOLCHAIN.txt
      - name: Upload compiled package and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicBubbles-Lab-0.1.0-rootless
          path: |
            work/packages/*.deb
            work/BUILD_LOG.txt
            work/PACKAGE_VALIDATION.txt
            work/BUILD_SHA256.txt
            work/BUILD_TOOLCHAIN.txt
            work/RUNNER_TESTS.txt
            work/SHA256_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
