name: ClassicBubbles Lab 0.1.10 guarded legacy motion
on:
  push:
    branches: [ci/classicbubbles-lab-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified baseline and apply checked recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8db7583027ac599e81910c8a4515451b9ced52fb
          git show 8db7583027ac599e81910c8a4515451b9ced52fb:.github/workflows/classicbubbles.yml > /tmp/cbl017-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess,textwrap
          previous=Path('/tmp/cbl017-workflow.yml').read_text()
          block=previous.split('        run: |\n',1)[1].split('          python3 tests/ui_provenance_test.py',1)[0]
          assert '45 file hashes match audited v0.1.7' in block
          subprocess.run(['/bin/bash','-e','-o','pipefail','-c',textwrap.dedent(block)],check=True)
          encoded=''.join(Path(f'ci/classicbubbles/v018.patch.part{i}.b64').read_text() for i in range(1,7))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='490b0c16663d01a7a9adbfbe235cbc7a5f0005cbda98fa515fcd8cb8b4c33c5d'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='8ebd9a1157c550fefda8dd98b3145fa747e2bbec537c8a013bc9368e86584e80'
          Path('/tmp/v018.patch').write_bytes(patch)
          subprocess.run(['patch','-p1','-F','0','--batch','--forward','-i','/tmp/v018.patch'],cwd='work',check=True)
          root=Path('work')
          raw=(root/'SHA256_MANIFEST.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='611084d42897f5dd449c1ca310b1fe4946a5669597f79ccee8b09cbaeda6274e'
          manifest=json.loads(raw)
          files={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and p.name!='SHA256_MANIFEST.json'}
          assert files==set(manifest) and len(files)==56
          for path,expected in manifest.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          # Darwin exposes these protections through its full feature namespace.
          old = '#define _POSIX_C_SOURCE 200809L\n'
          new = '#if defined(__APPLE__)\n#define _DARWIN_C_SOURCE 1\n#else\n#define _POSIX_C_SOURCE 200809L\n#endif\n'
          for name in ('common/CBLJournal.c','tests/journal_test.c'):
              p=root/name
              original=p.read_text()
              assert original.startswith(old)
              p.write_text(new+original[len(old):])
              manifest[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          raw=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          assert hashlib.sha256(raw).hexdigest()=='5de5647459cea646b99d2d5fb407300aae59a2d6e89087aa7c3397001f79cccc'
          (root/'SHA256_MANIFEST.json').write_bytes(raw)
          for path in ('layout/DEBIAN/postinst','layout/DEBIAN/postrm','tests/run_macos.sh'):
              (root/path).chmod(0o755)
          print('PASS: all 56 source hashes match reviewed v0.1.8; modern preview untouched')
          PY
      - name: Apply integrity-checked v0.1.9 gated legacy attachment patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/classicbubbles/v019.patch.part1.b64 ci/classicbubbles/v019.patch.part2.b64 ci/classicbubbles/v019.patch.part3.b64 ci/classicbubbles/v019.patch.part4.b64 | base64 -D > /tmp/v019.patch.xz
          echo 'ddfaae79f4918ecf4f77c497bbee5aa2e3c0c2c6eaebfacf41a2c034be1a9748  /tmp/v019.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v019.patch.xz > /tmp/v019.patch
          echo 'b8954b1be9e467d6c42f310520067726fde81692048b763eb4059ffb75ed1188  /tmp/v019.patch' | shasum -a 256 -c -
          (cd work && patch -p1 -F 0 --batch --forward -i /tmp/v019.patch)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('work')
          raw=(root/'SHA256_MANIFEST.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='a41f2fbef32a3fea8b7e441b8e28b0985689ab0b3739b036f62e48a1372d81c1'
          manifest=json.loads(raw)
          files=[p for p in root.rglob('*') if p.is_file() and p.name!='SHA256_MANIFEST.json']
          assert len(files)==len(manifest)==57, (len(files),len(manifest))
          assert {str(p.relative_to(root)) for p in files}==set(manifest)
          for filename,expected in manifest.items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==expected,filename
          assert hashlib.sha256((root/'lab/CBLPreview.m').read_bytes()).hexdigest()=='8cb2a3cf743742d2671b5f5e41aa9163957f926abaf7b43e43a35faea45bb483'
          for fname in ('layout/DEBIAN/postinst','layout/DEBIAN/postrm','tests/run_macos.sh'):
              assert (root/fname).exists()
              (root/fname).chmod(0o755)
          print('PASS: 57 exact v0.1.9 source hashes; user-verified native Bokeh renderer unchanged')
          PY
      - name: Apply reviewed 0.1.10 legacy motion patch (hash-checked)
        shell: bash
        run: |
          set -euo pipefail
          cat ci/classicbubbles/v0110.patch.part1.b64 ci/classicbubbles/v0110.patch.part2.b64 ci/classicbubbles/v0110.patch.part3.b64 ci/classicbubbles/v0110.patch.part4.b64 ci/classicbubbles/v0110.patch.part5.b64 | base64 -D > /tmp/v0110.patch.xz
          echo 'e679331a1843844120990e45ae5bae5c9631c147811efbb2a3b974b2d76c657c  /tmp/v0110.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v0110.patch.xz > /tmp/v0110.patch
          echo '2cae88c7942e5a543967bf2924263c5d916b2e9b2b16bfe9fa692d2c56e253f8  /tmp/v0110.patch' | shasum -a 256 -c -
          (cd work && patch -p1 -F 0 --batch --forward -i /tmp/v0110.patch)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('work')
          raw=(root/'SHA256_MANIFEST.json').read_bytes()
          expected='e43c28b6299e14f829fcf64ed77cacf704a081d0049a84520a619dcaa3534993'
          assert hashlib.sha256(raw).hexdigest()==expected
          manifest=json.loads(raw)
          files=[p for p in root.rglob('*') if p.is_file() and p.name!='SHA256_MANIFEST.json']
          assert len(files)==len(manifest)==62
          assert {str(p.relative_to(root)) for p in files}==set(manifest)
          for name,sha in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          assert hashlib.sha256((root/'lab/CBLPreview.m').read_bytes()).hexdigest()=='8cb2a3cf743742d2671b5f5e41aa9163957f926abaf7b43e43a35faea45bb483'
          for name in ('layout/DEBIAN/postinst','layout/DEBIAN/postrm','tests/run_macos.sh'):
              (root/name).chmod(0o755)
          print('PASS: 62 exact v0.1.10 files; modern Bokeh renderer SHA unchanged')
          PY
      - name: Regression and executable recovery tests
        working-directory: work
        shell: bash
        run: bash tests/run_macos.sh
      - name: Install Theos and SDK
        uses: waruhachi/theos-action@97afc8c6c361c8b379ee64f42c8a0e41d725ce37
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: 'false'
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'
      - name: Verify exact toolchain revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = '8167f59de02fd32cf45b16bfcb1330dfa5c9974c'
          test "$(git -C "$THEOS/sdks" rev-parse HEAD)" = '0222fd5413cf4b9af096f37b4621afa2688572f7'
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
      - name: Build native ARM64 binaries and validate package
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee BUILD_LOG.txt
          for deb in packages/*.deb; do
            stage=$(mktemp -d)
            dpkg-deb --raw-extract "$deb" "$stage"
            dpkg-deb --root-owner-group -Zxz -z9 --build "$stage" "$deb.normalized"
            mv "$deb.normalized" "$deb"
            rm -rf -- "$stage"
          done
          python3 tests/validate_deb.py packages/*.deb | tee PACKAGE_VALIDATION.txt
          shasum -a 256 packages/*.deb | tee BUILD_SHA256.txt
          { xcodebuild -version; xcrun clang --version; git -C "$THEOS" rev-parse HEAD; } > BUILD_TOOLCHAIN.txt
      - name: Upload installer and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicBubbles-Lab-0.1.10-rootless
          path: |
            work/packages/*.deb
            work/*TESTS.txt
            work/BUILD_LOG.txt
            work/PACKAGE_VALIDATION.txt
            work/BUILD_SHA256.txt
            work/BUILD_TOOLCHAIN.txt
            work/SHA256_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
