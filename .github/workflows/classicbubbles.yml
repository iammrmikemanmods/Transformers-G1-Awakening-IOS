name: ClassicBubbles Lab 0.1.8 legacy crash recovery
on:
  push:
    branches: [ci/classicbubbles-lab-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified baseline and apply checked recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8db7583027ac599e81910c8a4515451b9ced52fb
          git show 8db7583027ac599e81910c8a4515451b9ced52fb:.github/workflows/classicbubbles.yml > /tmp/cbl017-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess,textwrap
          previous=Path('/tmp/cbl017-workflow.yml').read_text()
          block=previous.split('        run: |\n',1)[1].split('          python3 tests/ui_provenance_test.py',1)[0]
          assert '45 file hashes match audited v0.1.7' in block
          subprocess.run(['/bin/bash','-e','-o','pipefail','-c',textwrap.dedent(block)],check=True)
          encoded=''.join(Path(f'ci/classicbubbles/v018.patch.part{i}.b64').read_text() for i in range(1,7))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='490b0c16663d01a7a9adbfbe235cbc7a5f0005cbda98fa515fcd8cb8b4c33c5d'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='8ebd9a1157c550fefda8dd98b3145fa747e2bbec537c8a013bc9368e86584e80'
          Path('/tmp/v018.patch').write_bytes(patch)
          subprocess.run(['patch','-p1','-F','0','--batch','--forward','-i','/tmp/v018.patch'],cwd='work',check=True)
          root=Path('work')
          raw=(root/'SHA256_MANIFEST.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='611084d42897f5dd449c1ca310b1fe4946a5669597f79ccee8b09cbaeda6274e'
          manifest=json.loads(raw)
          files={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and p.name!='SHA256_MANIFEST.json'}
          assert files==set(manifest) and len(files)==56
          for path,expected in manifest.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          for path in ('layout/DEBIAN/postinst','layout/DEBIAN/postrm','tests/run_macos.sh'):
              (root/path).chmod(0o755)
          print('PASS: all 56 source hashes match reviewed v0.1.8; modern preview untouched')
          PY
      - name: Regression and executable recovery tests
        working-directory: work
        shell: bash
        run: bash tests/run_macos.sh
      - name: Install Theos and SDK
        uses: waruhachi/theos-action@97afc8c6c361c8b379ee64f42c8a0e41d725ce37
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: 'false'
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'
      - name: Verify exact toolchain revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = '8167f59de02fd32cf45b16bfcb1330dfa5c9974c'
          test "$(git -C "$THEOS/sdks" rev-parse HEAD)" = '0222fd5413cf4b9af096f37b4621afa2688572f7'
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
      - name: Build native ARM64 binaries and validate package
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee BUILD_LOG.txt
          for deb in packages/*.deb; do
            stage=$(mktemp -d)
            dpkg-deb --raw-extract "$deb" "$stage"
            dpkg-deb --root-owner-group -Zxz -z9 --build "$stage" "$deb.normalized"
            mv "$deb.normalized" "$deb"
            rm -rf -- "$stage"
          done
          python3 tests/validate_deb.py packages/*.deb | tee PACKAGE_VALIDATION.txt
          shasum -a 256 packages/*.deb | tee BUILD_SHA256.txt
          { xcodebuild -version; xcrun clang --version; git -C "$THEOS" rev-parse HEAD; } > BUILD_TOOLCHAIN.txt
      - name: Upload installer and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicBubbles-Lab-0.1.8-rootless
          path: |
            work/packages/*.deb
            work/*TESTS.txt
            work/BUILD_LOG.txt
            work/PACKAGE_VALIDATION.txt
            work/BUILD_SHA256.txt
            work/BUILD_TOOLCHAIN.txt
            work/SHA256_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
