name: ClassicBubbles Lab 0.1.2 full-screen Apple Bokeh experiment
on:
  push:
    branches: [ci/classicbubbles-lab-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and apply integrity-checked 0.1.1 + 0.1.2 patches
        shell: bash
        run: |
          set -euo pipefail
          cat ci/classicbubbles/source.part*.b64 | base64 -D > /tmp/classicbubbles-source.tar.xz
          echo 'b11ac84dc5c63860b3bf189e3fec95efcc9c7133b2187513d4194f877dde81b8  /tmp/classicbubbles-source.tar.xz' | shasum -a 256 -c -
          cat ci/classicbubbles/v011.patch.part1 ci/classicbubbles/v011.patch.part2 ci/classicbubbles/v011.patch.part3 > /tmp/v011.patch.xz
          echo '29d598152f5f83c2d7bb59bb4721a7db322b2ceb3e477a4eccdaf8329f415dda  /tmp/v011.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v011.patch.xz > /tmp/v011.patch
          echo 'd819371b72a72431c3a5c432dcf91b84acde1f2c5755164894d5494397537ec4  /tmp/v011.patch' | shasum -a 256 -c -
          mkdir work
          tar -xJf /tmp/classicbubbles-source.tar.xz -C work
          cd work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          for path, expected in json.loads(Path('SHA256_MANIFEST.json').read_text()).items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          PY
          patch -p1 -F 0 --batch --forward -i /tmp/v011.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          paths = [p for p in sorted(Path('.').rglob('*')) if p.is_file() and p.name != 'SHA256_MANIFEST.json']
          assert len(paths) == 31, [str(p) for p in paths]
          manifest = {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          text = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          assert hashlib.sha256(text.encode()).hexdigest() == '330828ec3ebd9ee4569eaaeaa23c652145d452f501bab418aa9f97980297323c', text
          Path('SHA256_MANIFEST.json').write_text(text)
          print('PASS: all 31 source file hashes match the audited 0.1.1 source')
          PY
          cat ci/classicbubbles/v012.patch.part1 ci/classicbubbles/v012.patch.part2 ci/classicbubbles/v012.patch.part3 ci/classicbubbles/v012.patch.part4 | base64 -D > /tmp/v012.patch.xz
          echo '70cc3d72d2e579b09b3ff0a5df1806aaecedee5dc38ed6a18b08a2c4c1ee1fcc  /tmp/v012.patch.xz' | shasum -a 256 -c -
          xz -dc /tmp/v012.patch.xz > /tmp/v012.patch
          echo 'a56daeae074ca113f326e7afbc3c63574f0028d845c702938dad50fc203be4ac  /tmp/v012.patch' | shasum -a 256 -c -
          patch -p1 -F 0 --batch --forward -i /tmp/v012.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          paths = [p for p in sorted(Path('.').rglob('*')) if p.is_file() and p.name != 'SHA256_MANIFEST.json']
          assert len(paths) == 31, [str(p) for p in paths]
          manifest = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          txt = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          actual = hashlib.sha256(txt.encode()).hexdigest()
          assert actual == '35be906d52e63968e8ea2d1fdaf09a57fb6558e0aa2e7dfc37f5a8ff3cb32101', actual
          Path('SHA256_MANIFEST.json').write_text(txt)
          print('PASS: all 31 source hashes match audited 0.1.2')
          PY
          python3 tests/test_source.py
          clang -O2 -Wall -Wextra -Werror common/CBLRunner.c tests/runner_test.c -o /tmp/cbl-runner-test
          /tmp/cbl-runner-test | tee RUNNER_TESTS.txt
          clang -O2 -Wall -Wextra -Werror common/CBLColor.c tests/color_test.c -o /tmp/cbl-color-test
          /tmp/cbl-color-test | tee COLOR_TESTS.txt
          clang -fobjc-arc -fblocks -O2 -Wall -Wextra -Werror -framework Foundation -framework CoreFoundation common/CBLPresets.m common/CBLColor.c tests/preset_test.m -o /tmp/cbl-preset-test
          /tmp/cbl-preset-test | tee PRESET_TESTS.txt
      - name: Install pinned Theos and SDK
        uses: waruhachi/theos-action@97afc8c6c361c8b379ee64f42c8a0e41d725ce37
        with:
          theos-src: theos/theos
          theos-branch: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
          sdks-src: theos/sdks
          sdks-branch: 0222fd5413cf4b9af096f37b4621afa2688572f7
          remotelog: 'false'
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'
      - name: Ensure packaging tools
        shell: bash
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
      - name: Compile actual ARM64 app and helper, package and verify
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee BUILD_LOG.txt
          for deb in packages/*.deb; do
            stage=$(mktemp -d)
            dpkg-deb --raw-extract "$deb" "$stage"
            dpkg-deb --root-owner-group -Zxz -z9 --build "$stage" "$deb.normalized"
            mv "$deb.normalized" "$deb"
            rm -rf -- "$stage"
          done
          python3 tests/validate_deb.py packages/*.deb | tee PACKAGE_VALIDATION.txt
          shasum -a 256 packages/*.deb | tee BUILD_SHA256.txt
          { xcodebuild -version; xcrun clang --version; git -C "$THEOS" rev-parse HEAD; } > BUILD_TOOLCHAIN.txt
      - name: Upload compiled package and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicBubbles-Lab-0.1.2-rootless
          path: |
            work/packages/*.deb
            work/BUILD_LOG.txt
            work/PACKAGE_VALIDATION.txt
            work/BUILD_SHA256.txt
            work/BUILD_TOOLCHAIN.txt
            work/RUNNER_TESTS.txt
            work/COLOR_TESTS.txt
            work/PRESET_TESTS.txt
            work/SHA256_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
